# Faz 9.6 — onaylanan kullanıcı katkılarını otomatik yayınlar (9.6.12, 9.6.13)
#
# Tetikleyici iki yönlü:
#   1. repository_dispatch — Supabase'deki `notify_submission_approved`
#      tetikleyicisi (pg_net) onay anında çağırır. Gecikme saniyeler.
#      ⚠️ Dashboard'daki "Database Webhook" KULLANILMADI: gövdesi sabit,
#      GitHub'ın istediği `event_type` alanı konulamıyor (422 dönerdi).
#   2. schedule — webhook düşerse onaylar birikip beklemesin diye saatlik yedek.
#
# ⚠️ SUPABASE_SERVICE_KEY repo secret'ında. Repo PUBLIC olduğu için script
# hata mesajlarında anahtarı yazdırmıyor; log'a asla echo etme.
name: Katkıları yayınla

on:
  repository_dispatch:
    types: [submission-approved]
  schedule:
    - cron: '17 * * * *'   # saat başı 17. dakika (tepe saatlerden kaçınmak için)
  workflow_dispatch:        # elle tetikleme (sorun giderme)

concurrency:
  group: publish-submissions
  cancel-in-progress: false   # yarım kalan yayın version.json'ı bozabilir

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # ⚠️ Üretici script bu depoda tutuluyor, FormDa'dan ÇEKİLMİYOR:
      # FormDa private ve `GITHUB_TOKEN` yalnızca kendi deposuna erişiyor,
      # çapraz checkout "Not Found" ile kırılıyordu.
      - name: Veri deposunu al
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Onaylanan katkıları yayına çıkar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FORMDA_DATA: ${{ github.workspace }}
        run: python3 scripts/export_submissions.py --apply

      - name: Değişiklik varsa commit'le
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Yeni onay yok, commit atlandı."
            exit 0
          fi
          git config user.name  "formda-bot"
          git config user.email "bot@formda.app"
          git add foods/community_tr_v1.json \
                  exercises/community_exercises_v1.json \
                  version.json
          git commit -m "data: onaylanan kullanıcı katkıları yayınlandı"
          git push
